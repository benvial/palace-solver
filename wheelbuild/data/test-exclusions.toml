# Test exclusions: the upstream test cases the upstream test gate does not
# require to pass, each on the platforms it lists, with the reason.
#
# An entry names a Catch2 test case, so it covers every ctest entry the case is
# registered as (serial-, mpi-, regression-). It is held to account on every
# platform it lists, wherever that platform runs the gate:
#
# - a name the suite does not register fails the row;
# - an excluded case that passes fails the row.
#
# So the list only shrinks deliberately. wheelbuild/upstream_gate.py reads it, and
# tests/test_upstream_gate.py checks its format. It is part of the gate
# fingerprint, so an edit here makes regression due again.

# Charting decision 6 of the palace-tests effort: MFEM keeps aborting, as
# upstream ships it, so these 18 cases cannot pass on any platform.

[[exclusion]]
test = "SurfaceCurrentOperator owns element apertures and current weights"
platforms = ["manylinux_2_28_x86_64", "manylinux_2_28_aarch64", "macosx_15_0_arm64", "win_amd64"]
reason = "needs MFEM_USE_EXCEPTIONS (a throw-check; without it MFEM aborts the process)"

