name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest ruff mypy packaging
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy palace_solver
      # The build tooling runs on the container's Python, not on the 3.10 floor
      # the wheel itself keeps, so it may use tomllib.
      - run: mypy --python-version 3.11 wheelbuild
      - run: python -m pytest -q
      # Fails when the vendored MPICH leaves the mpich range palais pins.
      # Only this side is checked: palais is not reachable from CI here, so
      # its own pin moving is caught by running this with --palais against a
      # checkout. See wheelbuild/pin_check.py.
      - run: python -m wheelbuild.pin_check
      # A tag that does not name palace_solver.__version__ would publish a
      # release under a number nobody chose, and PyPI never lets a filename be
      # reused. Checked here rather than in the wheel job so it fails in
      # seconds instead of after the build.
      - name: Check the release tag against the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -m wheelbuild.tag_check "$GITHUB_REF_NAME"

  wheel:
    name: build manylinux_2_28 x86_64 wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      # palace_solver.__version__ mirrors the Palace release, and is the only
      # place the version is written down.
      - name: Resolve Palace version
        run: |
          version=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('palace_solver/__init__.py').read_text()).group(1))")
          echo "PALACE_VERSION=$version" >> "$GITHUB_ENV"

      # The build compiles MPICH, OpenBLAS and the Palace superbuild (hypre, MFEM,
      # libCEED, SuperLU_DIST, STRUMPACK, MUMPS, SLEPc, ARPACK, LIBXSMM,
      # GSLIB): 30-60+ minutes cold. The cache holds the sources, the build
      # trees, the shared install prefix and ccache.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: /build
          key: superbuild-${{ env.PALACE_VERSION }}-${{ hashFiles('wheelbuild/superbuild.py', 'wheelbuild/mpich.py', 'wheelbuild/openblas.py', 'wheelbuild/prefix.py') }}-${{ github.sha }}
          restore-keys: |
            superbuild-${{ env.PALACE_VERSION }}-${{ hashFiles('wheelbuild/superbuild.py', 'wheelbuild/mpich.py', 'wheelbuild/openblas.py', 'wheelbuild/prefix.py') }}-
            superbuild-${{ env.PALACE_VERSION }}-

      # Paths stay relative to the working directory: inside a container job
      # `github.workspace` is the host path, which does not exist here.
      - name: Build wheel
        run: scripts/build-wheel.sh "$PALACE_VERSION"
        env:
          BUILD_ROOT: /build
          OUTPUT_DIR: wheelhouse

      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Smoke test in a clean virtual environment
        run: |
          scripts/smoke-test.sh \
            "$(ls wheelhouse/*.whl)" \
            "/build/palace-$PALACE_VERSION/examples/spheres/spheres.json"

      # The smoke test stops at --dry-run. This solves the example for real on
      # two ranks under both launchers, so collective communication is
      # exercised and the two results must agree.
      - name: Launcher interoperability
        run: |
          scripts/interop-test.sh \
            "$(ls wheelhouse/*.whl)" \
            "/build/palace-$PALACE_VERSION/examples/spheres/spheres.json"

      - name: Report wheel size
        run: |
          python3 -c "
          import pathlib, sys
          sys.path.insert(0, '.')
          from wheelbuild.assemble import size_report
          wheel = next(pathlib.Path('wheelhouse').glob('*.whl'))
          report = size_report(wheel)
          print(report.text)
          pathlib.Path('${GITHUB_STEP_SUMMARY}').write_text(report.text + '\n')
          sys.exit(0)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: palace-solver-manylinux_2_28_x86_64
          path: wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [checks, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: no API token stored in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: palace-solver-manylinux_2_28_x86_64
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
