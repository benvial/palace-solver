name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      # The release dry run. Deliberately an input on a manual event rather
      # than anything a push can reach: it uploads the version in
      # palace_solver.__version__ to TestPyPI, which consumes those three
      # filenames there for good, so it has to be something a human asks for
      # once per release rather than something main does on every merge.
      testpypi:
        description: "Upload the three wheels to TestPyPI as a release dry run"
        type: boolean
        default: false
      # Iteration on the Windows row. Windows work edits files the build cache
      # is keyed on, so a full run would send all four rows cold and hold a
      # second generation of keys -- about 9 GiB more against the 10 GB cap --
      # for changes that cannot affect the other three. This builds the
      # Windows row alone and prunes the branch's superseded Windows entries
      # after it. It is not path-filter gating: pull requests and pushes always
      # build every row.
      windows_only:
        description: "Build only the Windows row (iteration; never a release)"
        type: boolean
        default: false

concurrency:
  # The event is part of the group because the release dry run is dispatched
  # against main, which puts it in the same group as every push to main: one
  # merge during the three 40-minute builds would cancel the rehearsal, or the
  # rehearsal would cancel the merge's run. Nothing else changes — a push and a
  # pull request already differ by ref — and two dispatches against one ref
  # still supersede each other, which is what cancel-in-progress is for.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # ruff is pinned and everything else floats, because ruff is the only one
      # of these whose *new* releases change the verdict on code nobody touched:
      # it adds rules and changes formatting, and this gate runs both as hard
      # checks. It has broken this repository twice from a release alone --
      # 0.16 began formatting Python blocks inside Markdown, and 0.16.9 added
      # ISC004 -- each time turning a branch red for a reason that had nothing
      # to do with the branch, and each time invisible to the contributor who
      # had just run ruff locally.
      #
      # The pin is exact rather than a ceiling: a ceiling still floats within
      # itself, and a patch release is enough (0.16.9 was one). Bumping it is a
      # commit that says so, with whatever that version newly objects to fixed
      # in the same commit. tests/test_wheels_workflow.py ties it to the `dev`
      # extra, which is where a contributor gets the same version from.
      #
      # pefile is pinned for the other reason a tool gets pinned here: it is not
      # a test dependency but the PE reader the Windows link check and repair
      # run, so the tests have to exercise the version the build installs
      # (wheelbuild.link_check.PEFILE_REQUIREMENT). The same test ties all three.
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest "ruff==0.16.9" mypy packaging pyyaml "pefile==2024.8.26"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy palace_solver
      # The build tooling runs on the container's Python, not on the 3.10 floor
      # the wheel itself keeps, so it may use tomllib.
      - run: mypy --python-version 3.11 wheelbuild
      - run: python -m pytest -q
      # Fails when the vendored MPICH leaves the major series the interop
      # test proves the wheel against. See wheelbuild/pin_check.py.
      - run: python -m wheelbuild.pin_check
      # The Windows wheel's MS-MPI, downloaded from Microsoft, carved out of its
      # installer with the runner's 7z and checked file by file against the
      # hashes in wheelbuild/msmpi.py. Nothing in it needs Windows, so a moved
      # or altered download fails here in seconds rather than on the Windows
      # row. The installer is fetched on every run and never cached, which is
      # why wheelbuild/msmpi.py is not part of the build cache key.
      - name: Fetch and verify the MS-MPI redistributable
        run: python -m wheelbuild.msmpi "$RUNNER_TEMP/msmpi"
      # A tag that does not name palace_solver.__version__ would publish a
      # release under a number nobody chose, and PyPI never lets a filename be
      # reused. Checked here rather than in the wheel job so it fails in
      # seconds instead of after the build.
      - name: Check the release tag against the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -m wheelbuild.tag_check "$GITHUB_REF_NAME"

  # The matrix rows, from .github/wheel-matrix.toml, where the comments on each
  # row live too. A job of its own because a static `include` list cannot be
  # narrowed by an input; see wheelbuild/matrix.py.
  plan:
    name: plan the wheel matrix
    runs-on: ubuntu-24.04
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v5
      # A Windows-only run uploads one wheel, and a dry run that refuses it
      # after three hours of build is a worse place to learn that than here.
      - name: Refuse a Windows-only release dry run
        if: github.event_name == 'workflow_dispatch' && inputs.windows_only && inputs.testpypi
        run: |
          echo "::error::windows_only builds one wheel; a TestPyPI dry run needs all of them"
          exit 1
      - name: Select the rows
        id: rows
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_only && 'win_amd64' || '' }}
        run: python3 -m wheelbuild.matrix --only "$ONLY"

  wheel:
    name: build ${{ matrix.name }} wheel
    needs: [plan]
    strategy:
      # Four platforms share a 10 GB cache budget and each saves its own
      # entry; cancelling the others because one failed would throw away
      # 40 minutes of build for no gain.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rows) }}
    runs-on: ${{ matrix.runner }}
    # Explicit, because the Windows row's default would be PowerShell and every
    # shared step is bash; on Linux and macOS it adds only pipefail. The steps
    # that run on Windows say `python` rather than `python3`, which the Windows
    # toolcache does not provide; setup-python makes both the same interpreter
    # on the other runners.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The spike measured the build root at 2.3 GiB and D: is the runner's
      # scratch disk, whose size the image does not promise.
      - name: Log the Windows runner's free space
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive C, D | Format-Table -AutoSize

      # Every action in this job runs on the runner, not in the build image.
      # That is the point of driving the container with `docker run` instead of
      # a `container:` key: commit 2b37f36 had actions/cache and
      # actions/upload-artifact running on the manylinux image's Node, and that
      # class of problem is gone once they run on the runner's.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The compile half of the Windows build: gcc, g++ and gfortran, GNU make
      # and the POSIX tools Palace's superbuild drives, and MS-MPI's SDK.
      # Reusing the image's C:\msys64 (`release: false`) and installing
      # nothing newer than it has (`update: false`), so the toolchain changes
      # when the image does; its own package cache is off because it would
      # hold another 150-180 MiB entry against the shared 10 GB budget. The
      # packages roll and are not pinned (ADR-0007), so the driver logs
      # `pacman -Q`. MSYS2's `python` is the POSIX one PETSc's configure
      # insists on; the MinGW one is there because the spike's build had it.
      - name: Provision MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          cache: false
          install: >-
            make git patch diffutils perl tar unzip python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-msmpi

      # The cache path is a runner directory bind-mounted into the container,
      # so it has to exist and belong to the runner user before the restore
      # writes into it.
      - name: Create the build directory the cache and the container share
        if: matrix.image
        run: |
          sudo mkdir -p "${{ matrix.build_root }}"
          sudo chown "$(id -u):$(id -g)" "${{ matrix.build_root }}"

      # palace_solver.__version__ is the only place the version is written
      # down; the Palace release is that minus any .postN packaging segment,
      # which ships the same Palace under a tag upstream does not have.
      - name: Resolve Palace version and platform tag
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('palace_solver/__init__.py').read_text()).group(1).split('.post')[0])" | tr -d '\r')
          echo "PALACE_VERSION=$version" >> "$GITHUB_ENV"
          # The macOS floor the build compiles to, and the one input
          # platform_tag() cannot derive: read off the runner it would name the
          # machine that built the wheel rather than the oldest machine that
          # can install it. Exported for every row because it is ignored off
          # Darwin, and here rather than in the macOS driver because this step
          # needs it too.
          target=$(python -c 'from wheelbuild.platforms import MACOS_DEPLOYMENT_TARGET; print(MACOS_DEPLOYMENT_TARGET)' | tr -d '\r')
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"
          export MACOSX_DEPLOYMENT_TARGET="$target"
          # The cache key is namespaced by the tag the wheel itself carries, so
          # a second architecture cannot collide with this one. runner.arch was
          # the alternative and would label a manylinux_2_28-specific tree
          # "X64", which can drift from what the tree actually is.
          #
          # Derived from this runner, which is right because every platform
          # builds natively — the manylinux image matches the runner's
          # architecture. Checked against the row so a mismatched matrix entry
          # fails in seconds rather than by mis-tagging a wheel 40 minutes on.
          tag=$(python -c 'from wheelbuild.platforms import platform_tag; print(platform_tag())' | tr -d '\r')
          if [[ "$tag" != "${{ matrix.tag }}" ]]; then
            echo "::error::runner derives platform tag $tag, matrix row says ${{ matrix.tag }}"
            exit 1
          fi
          echo "PLATFORM_TAG=$tag" >> "$GITHUB_ENV"

      # The build compiles MPICH, OpenBLAS and the Palace superbuild (hypre, MFEM,
      # libCEED, SuperLU_DIST, STRUMPACK, MUMPS, SLEPc, ARPACK, LIBXSMM,
      # GSLIB): 30-60+ minutes cold. The cache holds the sources, the build
      # trees, the shared install prefix and ccache.
      #
      # The key deliberately carries no `github.sha`: with it, the exact key
      # could never hit, so every run — warm or cold — wrote another 2.4 GiB
      # entry and the repository sat at 9.6 GiB against GitHub's 10 GB cap on
      # one platform alone. Everything in the tree is pinned by what is already
      # in the key (the Palace version plus the hash of the five build scripts),
      # so the first build of a given key claims the entry and later builds of
      # the same key are exact hits that skip the save.
      #
      # scripts/build-in-container.sh is keyed along with the scripts it drives
      # because it chooses the image the tree is compiled in, and a tree built
      # in a different image is a different tree. It was not keyed before this
      # job shape existed only because the image was named by a `container:` key
      # the hash could not reach either — which was the same gap, unclosed.
      #
      # The test for membership here is whether editing the file changes the
      # bytes in the tree, not whether the build imports it. wheelbuild/platforms.py
      # is deliberately absent on that test: it decides which filenames the MPICH
      # and OpenBLAS validators look for, and nothing about how either is
      # compiled. Keying it would orphan every entry each time a new platform is
      # taught to it, buying a rebuild for a file that cannot change what was
      # built.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.build_root }}
          key: superbuild-${{ env.PLATFORM_TAG }}-${{ env.PALACE_VERSION }}-${{ hashFiles('scripts/build-in-container.sh', 'scripts/build-wheel.sh', 'scripts/build-macos.sh', 'scripts/build-windows.sh', 'wheelbuild/superbuild.py', 'wheelbuild/mpich.py', 'wheelbuild/openblas.py', 'wheelbuild/prefix.py') }}
          restore-keys: |
            superbuild-${{ env.PLATFORM_TAG }}-${{ env.PALACE_VERSION }}-
            superbuild-${{ env.PLATFORM_TAG }}-

      # The same script a developer runs locally, against the same image, with
      # the cache directory pointed at the one the restore just filled. CI
      # running the documented command is what keeps "reproducible on a
      # developer machine" a fact rather than a claim.
      - name: Build wheel in the container
        if: matrix.image
        run: scripts/build-in-container.sh "$PALACE_VERSION"
        env:
          MANYLINUX_IMAGE: ${{ matrix.image }}
          BUILD_CACHE: ${{ matrix.build_root }}

      # The same script a Mac owner runs, for the same reason: there is no
      # Apple Silicon machine on this project, so CI running the documented
      # command is the only thing keeping it documented. It drives the
      # wheelbuild modules in the order scripts/build-wheel.sh drives them and
      # differs only where macOS differs -- no dnf, one Homebrew GCC for all
      # three languages, a deployment target, a CMake pinned inside 3.31, and
      # delocate where the Linux driver runs auditwheel. It writes its wheel to
      # the same wheelhouse/, so every step after this one is shared.
      - name: Build wheel on the runner
        if: ${{ !matrix.image && runner.os != 'Windows' }}
        run: scripts/build-macos.sh "$PALACE_VERSION"
        env:
          BUILD_ROOT: ${{ matrix.build_root }}

      # The same script a Windows owner with MSYS2 runs. Under MSYS2's bash
      # rather than the job's, which on this runner is Git for Windows'; every
      # wheelbuild step inside it runs on the setup-python interpreter above,
      # which it finds through the pythonLocation that action exports. It ends
      # at an installed, version-checked Palace: assembly, repair and the wheel
      # are still to come, so the shared steps after the cache save fail on
      # this row until they do.
      - name: Build Palace under MSYS2
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/build-windows.sh "$PALACE_VERSION"
        env:
          BUILD_ROOT: ${{ matrix.build_root }}

      # The container needs root — the build installs ccache and patchelf with
      # dnf — so everything it writes is owned by root, and the runner user is
      # the one that then saves the cache, reads the wheel and uploads it.
      # Handing both trees over explicitly is cheaper than the alternatives: a
      # `--user` that keeps them readable cannot run dnf, and relying on the
      # build's umask leaving every directory world-readable is a silent
      # dependency on every sub-project's install step.
      #
      # Unconditional, and covering wheelhouse, because the wheel is written on
      # every run including an exact cache hit, and because the tree is worth
      # handing back even when the build failed — the save step keeps partial
      # progress.
      #
      # scripts/build-wheel.sh sets git's safe.directory for the mirror image of
      # this: once /build belongs to the runner user, the root process in the
      # container is the one looking at a repository it does not own.
      - name: Take ownership of what the container wrote as root
        if: always() && matrix.image
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${{ matrix.build_root }}"
          if [[ -d wheelhouse ]]; then
            sudo chown -R "$(id -u):$(id -g)" wheelhouse
          fi

      # A cache that fails open is worse than no cache: one file the saving user
      # cannot read makes actions/cache/save's tar exit 2, which the action
      # downgrades to a warning, so the next run pays a full cold build with
      # nothing anywhere to explain why. Fail the job instead. On the container
      # rows this is what proves the ownership hand-over above covered the
      # tree; on macOS, where the runner user wrote every file itself, it is
      # the same question asked of a tree nobody handed over.
      #
      # `tar -cf /dev/null` is not a substitute: GNU tar special-cases /dev/null
      # and never reads file data, so it reports success on a tree the real save
      # fails on. Nor is `find`: `-readable` is GNU-only, and its portable
      # spelling answers a different question — see wheelbuild/cache_guard.py.
      - name: Check the build tree is readable before saving it
        id: cache-guard
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        run: python -m wheelbuild.cache_guard "${{ matrix.build_root }}"

      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true' && steps.cache-guard.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.build_root }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # The half of the TestPyPI dry run that needs no index. PyPI validates a
      # wheel's metadata, and renders its description, more strictly than the
      # `wheel` module that wrote the metadata does -- and at upload time that
      # verdict arrives after the tag exists, under a version number no re-run
      # can reuse. `twine check` is the same validation the upload step runs
      # first, so running it here moves one class of release failure onto every
      # pull request.
      #
      # --strict because the thing being checked is a warning by default: a
      # description PyPI cannot render is served as raw markup on the project
      # page, which is cosmetic and therefore exactly the kind of problem that
      # ships.
      #
      # >=6.1 is not decoration. setuptools>=77 writes the license as an SPDX
      # expression, which is Metadata-Version 2.4, and twine 6.0 reads a 2.4
      # wheel as "metadata is missing required fields". A floor low enough to
      # resolve to that version would fail every build for a reason that is not
      # about this wheel.
      - name: Check the wheel's metadata the way PyPI will
        run: |
          python3 -m pip install --upgrade "twine>=6.1"
          python3 -m twine check --strict wheelhouse/*.whl

      # Run on the runner rather than back inside the build image, for the same
      # reason a user's machine is not a manylinux container: it proves the
      # wheel is self-contained outside the environment that produced it. It is
      # also the shape macOS has no choice about, so that row adds no step here.
      - name: Smoke test in a clean virtual environment
        run: |
          scripts/smoke-test.sh \
            "$(ls wheelhouse/*.whl)" \
            "${{ matrix.build_root }}/palace-$PALACE_VERSION/examples/spheres/spheres.json"

      # The smoke test stops at --dry-run. This solves the example for real on
      # two ranks under both launchers, so collective communication is
      # exercised and the two results must agree.
      #
      # Ungated, on every platform. The foreign launcher it pairs the wheel
      # with is the PyPI `mpich` wheel, which publishes a macosx_11_0_arm64
      # wheel for both the `mpich<5` series the vendored MPICH belongs to and
      # the `mpich>=5` one stage 4 reaches for -- so macOS needs no Homebrew
      # mpiexec and no source of its own.
      - name: Launcher interoperability
        run: |
          scripts/interop-test.sh \
            "$(ls wheelhouse/*.whl)" \
            "${{ matrix.build_root }}/palace-$PALACE_VERSION/examples/spheres/spheres.json"

      # Writes the job summary, so this is the size verdict a human reads. It
      # also fails on an oversized wheel rather than only saying OVER: a size
      # PyPI rejects is discovered at upload otherwise, after the tag exists and
      # under a version number no re-run can reuse. The build step refuses the
      # same wheel first (`wheelbuild.assemble.verify_size`), so on a normal run
      # this never fires; it is here because this is the step that reports, and
      # a report that prints a verdict and exits 0 is a report nothing acts on.
      - name: Report wheel size
        run: |
          python3 -c "
          import pathlib, sys
          sys.path.insert(0, '.')
          from wheelbuild.assemble import size_report
          wheel = next(pathlib.Path('wheelhouse').glob('*.whl'))
          report = size_report(wheel)
          print(report.text)
          pathlib.Path('${GITHUB_STEP_SUMMARY}').write_text(report.text + '\n')
          sys.exit(1 if report.exceeds_pypi_limit else 0)
          "

      - uses: actions/upload-artifact@v5
        with:
          name: palace-solver-${{ matrix.tag }}
          path: wheelhouse/*.whl

  # Deletes the entries a version bump or a build-script edit orphaned, so that
  # GitHub's least-recently-*read* eviction never drops a live one instead. What
  # is kept, what is never touched, and why this cannot be decided from the
  # runner it happens to run on are all in scripts/prune-build-caches.sh.
  #
  # `needs: [wheel]` waits for the whole matrix, so every row that is going to
  # save an entry for the current tree has already saved it by the time
  # anything is deleted — and a failed row skips this job rather than pruning
  # around a platform that saved nothing.
  cache-cleanup:
    name: delete stale build caches
    needs: [wheel]
    # Only after main has saved its replacement entry, and never for a pull
    # request — see the script for why a pull request's caches are not this
    # job's business.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Delete superbuild caches that no longer match main
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_HASH: ${{ hashFiles('scripts/build-in-container.sh', 'scripts/build-wheel.sh', 'scripts/build-macos.sh', 'scripts/build-windows.sh', 'wheelbuild/superbuild.py', 'wheelbuild/mpich.py', 'wheelbuild/openblas.py', 'wheelbuild/prefix.py') }}
        run: |
          # The same two components the wheel job's key ends in, spelled the
          # same way: the .post segment dropped, and the hash of the same file
          # list. They are what the script matches on, so a divergence here
          # would make every live entry look stale.
          version=$(python3 -c "from palace_solver import __version__; print(__version__.split('.post')[0])")
          scripts/prune-build-caches.sh "$version" "$INPUTS_HASH"

  # The Windows-only dispatch's half of the same job. Each edit to a keyed file
  # while iterating saves one more ~2.3 GiB Windows entry on the branch, and
  # two of them on top of main's three push the repository over its 10 GB cap,
  # where eviction takes whichever entry was read least recently -- possibly
  # one of main's. So after every such run the branch keeps only the Windows
  # entry for its current tree. The same script and the same guard as main's
  # cleanup: if no entry matches the current tree, nothing is deleted.
  #
  # always(), because an iteration run is expected to fail -- often after
  # saving the partial tree that the next one resumes from -- and the entry it
  # superseded is stale either way. Never on main, whose entries are
  # `cache-cleanup`'s alone.
  iteration-cache-cleanup:
    name: delete superseded Windows iteration caches
    needs: [wheel]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.windows_only
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Delete this branch's superseded Windows superbuild caches
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_HASH: ${{ hashFiles('scripts/build-in-container.sh', 'scripts/build-wheel.sh', 'scripts/build-macos.sh', 'scripts/build-windows.sh', 'wheelbuild/superbuild.py', 'wheelbuild/mpich.py', 'wheelbuild/openblas.py', 'wheelbuild/prefix.py') }}
        run: |
          version=$(python3 -c "from palace_solver import __version__; print(__version__.split('.post')[0])")
          scripts/prune-build-caches.sh "$version" "$INPUTS_HASH" \
            --ref "$GITHUB_REF" --key-prefix superbuild-win_amd64-

  # The rehearsal. Everything a release does except which index it lands on,
  # run before the tag exists so that the problems which only appear at upload
  # time appear while they are still fixable: a platform tag the index refuses,
  # a file over its size limit, and metadata validated more strictly than the
  # `wheel` module validated it.
  #
  # The verdict is the index's acceptance of the three files, and nothing is
  # installed back out of TestPyPI -- a wheel can only be installed on a
  # machine of its own platform, and each platform already installs its own and
  # solves an example on the row that built it. The trusted publisher it proves
  # is its own: this job authenticates to TestPyPI through the `testpypi`
  # environment, so a green dry run is evidence about the procedure and not
  # about the credentials `publish` will use.
  #
  # Manual, and gated on an input rather than on a ref, because the upload is
  # not free: TestPyPI reuses a filename no more than PyPI does, so each dry
  # run spends the three filenames of the version it carries. It costs nothing
  # against the PyPI quota, whose storage is separate.
  #
  # Everything that could differ from `publish` and does not is the point:
  # `needs`, the artifact collection and the wheel-set check are the same, and
  # tests/test_wheels_workflow.py ties each of them to the real job, because a
  # rehearsal that assembles a different directory rehearses a different
  # upload.
  publish-testpypi:
    name: dry-run publish to TestPyPI
    needs: [checks, wheel]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-24.04
    # Its own environment, not `release`: these are two separate trusted
    # publishers, and a required reviewer on the release gate should not also
    # stand in front of a rehearsal.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: palace-solver-*
          merge-multiple: true
          path: dist

      - name: Check dist holds exactly one wheel per supported platform
        run: python3 -m wheelbuild.release_check dist

      # No skip-existing. It would make the rehearsal repeatable where the
      # event it rehearses is not, and a green run over a version TestPyPI
      # already holds says nothing about the wheels in this directory. When a
      # dry run has to be repeated -- including after one that uploaded some of
      # the three and then failed -- the remedy is a .postN bump, which is free
      # before a tag exists and is the same move a half-published release on
      # PyPI would force.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # One release carrying every platform's wheel, uploaded once. Charting
  # decision 1 of .scratch/platform-expansion/map.md: nothing publishes until
  # every platform is green, because a release missing a platform is not
  # correctable -- PyPI never lets a filename be reused, so the repair is a new
  # version number rather than a re-run.
  #
  # `needs: [checks, wheel]` is what enforces that. It waits for the whole
  # matrix, and a failed row fails the `wheel` job, which skips this one: the
  # `if` gates on the ref alone and deliberately carries no always() or
  # !cancelled(), either of which would let a partial matrix publish a subset.
  publish:
    name: publish to PyPI
    needs: [checks, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      # Trusted publishing: no API token stored in the repository.
      id-token: write
    steps:
      # For wheelbuild.release_check below, which is stdlib-only and runs on the
      # runner's preinstalled Python -- nothing is installed into the job that
      # holds the publishing token.
      - uses: actions/checkout@v5

      # By pattern rather than by name: the matrix uploads one artifact per row
      # named from the row, so naming them here is how this job came to collect
      # the x86_64 wheel alone while the other two sat in the run's artifacts.
      # merge-multiple puts all three wheels in one flat directory, which is
      # what the upload step publishes; without it each artifact lands in a
      # subdirectory of its own and the upload finds no wheel at all.
      #
      # tests/test_wheels_workflow.py derives this pattern from the upload
      # step's own name, so a renamed artifact cannot be collected by one and
      # missed by the other.
      - uses: actions/download-artifact@v5
        with:
          pattern: palace-solver-*
          merge-multiple: true
          path: dist

      # Nothing between the download and the upload would otherwise notice a
      # missing platform: matching no artifact is a warning rather than an
      # error, and gh-action-pypi-publish uploads whatever the directory holds.
      # This is the last point at which a release is still repairable.
      - name: Check dist holds exactly one wheel per supported platform
        run: python3 -m wheelbuild.release_check dist

      - uses: pypa/gh-action-pypi-publish@release/v1
